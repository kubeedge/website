  <g fill="#fff" font-family="Arial, Helvetica, sans-serif">
    <text x="113" y="214" font-size="142" font-weight="600" letter-spacing="-10">intel</text>
    <text x="112" y="326" font-size="108" font-weight="400" letter-spacing="-6">CORE</text>
    <text x="116" y="482" font-size="63" font-weight="700" letter-spacing="3">ULTRA</text>
