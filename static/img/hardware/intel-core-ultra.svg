<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 658 558" role="img" aria-labelledby="title desc">
  <title id="title">Intel Core Ultra</title>
  <desc id="desc">Intel Core Ultra style reference graphic used for KubeEdge hardware validation cards</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1732c7"/>
      <stop offset="55%" stop-color="#071a83"/>
      <stop offset="100%" stop-color="#00155d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2739a7"/>
      <stop offset="100%" stop-color="#050d4c"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#6fe9ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#6fe9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="658" height="558" fill="url(#bg)"/>
  <rect width="658" height="558" fill="url(#glow)"/>

  <g opacity=".18">
    <circle cx="420" cy="55" r="2" fill="#7be9ff"/>
